[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".git", "__pycache__", ".venv", "node_modules", ".next"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "S",    # bandit security
  "T20",  # flake8-print
  "RUF",  # ruff-specific
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "S101",   # use of assert in tests
  "S104",   # binding to 0.0.0.0
  "B008",   # function call in default argument (FastAPI pattern)
  "RUF001", # ambiguous unicode — Persian text is intentional
  "RUF002",
  "RUF003",
  "RUF012",
  "RUF022",
  "UP042",
  "N818",
  "S112",
  "S310",
  "S324",
  "B905",
  "T201",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "T20"]
"scripts/**" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
