name: MousaviTax CI

on:
  push:
    branches: [main, 'wo/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run API tests
        env:
          PYTHONPATH: app:../../packages/shared:../../packages/ai-gateway/app:../../packages/taxlaw-engine:../../packages/prompt-engine:../../packages/knowledge-core:../../packages/embedding-service/app:../../packages/retrieval-engine/app:../../packages/document-parser
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build web
        run: npm run build
