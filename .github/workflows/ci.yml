name: CI

on:
  push:
    branches: [main, "feat/**", "wo/**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. TypeScript — typecheck + lint + build + unit tests
  # --------------------------------------------------------------------------
  build-web:
    name: Web — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  build-mka-core:
    name: MKA-Core — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mka-core
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile || bun install
      - run: bun run build

  # --------------------------------------------------------------------------
  # 2. Python — typecheck, lint, unit tests
  # --------------------------------------------------------------------------
  python-tests:
    name: Python — typecheck, lint, tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: packages
      PYTHON_VERSION: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            packages/*/requirements.txt
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov httpx
      - name: Ruff lint
        run: ruff check apps/api packages services tests
      - name: Mypy typecheck
        run: mypy apps/api packages services --ignore-missing-imports || true
      - name: Pytest
        run: pytest -q tests --cov=apps/api --cov=packages --cov-report=term-missing

  # --------------------------------------------------------------------------
  # 3. Database — validate migrations apply cleanly
  # --------------------------------------------------------------------------
  validate-migrations:
    name: Database — validate migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: ci
    steps:
      - uses: actions/checkout@v4
      - name: Install pgvector
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
      - name: Apply migrations in order (fail on first error)
        run: |
          shopt -s nullglob
          files=(
            infra/postgres/*.sql
            infra/postgres/migrations/*.sql
          )
          if [ ${#files[@]} -eq 0 ]; then echo "No migrations found"; exit 1; fi
          for f in "${files[@]}"; do
            echo "::group::Applying $f"
            psql -v ON_ERROR_STOP=1 --single-transaction -f "$f"
            echo "::endgroup::"
          done
      - name: Check expected tables exist
        run: |
          for t in tax_cases legal_workflows workflow_events workflow_artifacts workflow_gates audit_logs knowledge_documents tenants; do
            exists=$(psql -tAc "select to_regclass('public.$t')")
            if [ -z "$exists" ]; then echo "Missing table: $t"; exit 1; fi
          done

  # --------------------------------------------------------------------------
  # 4. Security scans — secrets, dependencies
  # --------------------------------------------------------------------------
  secret-scan:
    name: Security — secret leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for secret scan
      - name: Trufflehog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified

  dependency-audit:
    name: Security — dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes audit-ci --moderate || true
        working-directory: apps/web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r apps/api/requirements.txt || true

  # --------------------------------------------------------------------------
  # 5. Final gate — only merge if all green
  # --------------------------------------------------------------------------
  all-green:
    name: All checks green
    runs-on: ubuntu-latest
    needs: [build-web, build-mka-core, python-tests, validate-migrations, secret-scan, dependency-audit]
    if: always()
    steps:
      - name: Gate
        run: |
          for job in build-web build-mka-core python-tests validate-migrations secret-scan dependency-audit; do
            result="${{ needs.build-web.result }}"
            if [[ "${{ needs.*.result }}" == *"failure"* ]]; then
              echo "One or more jobs failed — refusing to allow merge."
              exit 1
            fi
          done
          echo "All required jobs passed."
